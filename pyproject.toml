[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-triage-agent"
version = "0.1.0"
description = "A public-data RAG defect triage agent using GitHub Issues."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "openai>=1.40",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.7",
  "streamlit>=1.36",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

